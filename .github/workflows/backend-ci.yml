name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: rydr-backend/services/bank
            command: npm test
          - directory: rydr-backend
            command: npm test
          - directory: rydr-backend/services/stripe
            command: npm test
          - directory: rydr-backend/firebase/functions
            command: npm run build
          - directory: RydrMissionControl
            command: npm run build
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}
